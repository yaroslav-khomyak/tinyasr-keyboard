name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35"

      - name: Cache tinyasr build
        uses: actions/cache@v4
        with:
          path: |
            third_party/tinyasr
            ~/.cargo/registry
          key: tinyasr-${{ hashFiles('scripts/prepare.sh') }}

      - name: Build tinyasr and unpack the models
        run: scripts/prepare.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk tinyasr-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tinyasr-keyboard
          path: tinyasr-keyboard.apk

      # A direct download link that works on a phone: Releases -> latest.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tinyasr-keyboard.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}." --target "${GITHUB_SHA}"
