name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35"

      - name: Cache tinyasr build
        uses: actions/cache@v4
        with:
          path: |
            third_party/tinyasr
            ~/.cargo/registry
          key: tinyasr-${{ hashFiles('scripts/prepare.sh') }}

      - name: Build tinyasr and unpack the models
        run: scripts/prepare.sh

      - name: Build the JNI bridge for the test machine
        run: scripts/host-bridge.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-daemon testReleaseUnitTest

      # The private key comes from the repository's secrets; without them the public sideload key is used.
      - name: Prepare the signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No signing secrets: signing with the public sideload key"
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Show the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk tinyasr-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tinyasr-keyboard
          path: tinyasr-keyboard.apk

      # A direct download link that works on a phone: Releases -> latest.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tinyasr-keyboard.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}." --target "${GITHUB_SHA}"
