plugins {
    id "com.android.application"
}

android {
    namespace "app.voicekb.tinyasr"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "app.voicekb.tinyasr"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // A fixed key kept in the repository, so that every build can be installed over the previous one.
        // Fine for a personal sideloaded app; replace it before publishing anywhere.
        shared {
            storeFile rootProject.file("signing/sideload.jks")
            storePassword "tinyasr"
            keyAlias "sideload"
            keyPassword "tinyasr"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        // The models, put there by scripts/prepare.sh.
        main.assets.srcDir "build/tinyasr/assets"
    }

    androidResources {
        // The models are mapped straight from the APK.
        noCompress "tzf", "onnx"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all {
            // BridgeHostTest runs the real model through the JNI bridge built by scripts/host-bridge.sh.
            systemProperty "java.library.path", file("build/tinyasr/host").absolutePath
            systemProperty "tinyasr.hostlib", file("build/tinyasr/host").absolutePath
            systemProperty "tinyasr.assets", file("build/tinyasr/assets").absolutePath
            testLogging {
                events "passed", "skipped", "failed"
                exceptionFormat "full"
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    // Android's org.json is only a stub in local unit tests.
    testImplementation "org.json:json:20240303"
}

// Fails early, with the fix, if the native library or the models have not been prepared.
tasks.register("checkTinyasr") {
    doLast {
        def need = ["build/tinyasr/arm64-v8a/libtinyasr.a", "build/tinyasr/assets/en-ru-uk.tzf",
                    "build/tinyasr/assets/silero_vad.onnx"]
        need.each {
            if (!file(it).exists()) throw new GradleException("app/${it} is missing: run scripts/prepare.sh first")
        }
    }
}
preBuild.dependsOn "checkTinyasr"
